[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsl"
version = "0.1.0"
description = "From Scratch Lab: a reproducible first-principles laboratory"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "mpmath>=1.3",
    "pandas>=2.1",
    "requests>=2.31",
    "cryptography>=42",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["src"]
